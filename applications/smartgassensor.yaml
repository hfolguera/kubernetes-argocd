apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartgassensor
  namespace: argocd
spec:
  destination:
    namespace: smartgassensor
    server: https://kubernetes.default.svc
  project: calfolguera
  source:
    path: k8s
    repoURL: https://github.com/hfolguera/SmartGasSensor.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
