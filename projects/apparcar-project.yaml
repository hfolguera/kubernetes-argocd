apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apparcar
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Project for AppArCar application"
  sourceRepos:
  - "*"
  destinations:
  - namespace: "*"
    server: "https://kubernetes.default.svc"
  clusterResourceWhitelist:
  - group: "*"
    kind: "*"
  namespaceResourceWhitelist:
  - group: "*"
    kind: "*"
